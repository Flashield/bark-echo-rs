[workspace]
resolver = "2"
members = ["crates/echo-core", "crates/echo-daemon", "crates/echo-ipc"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
echo-core = { path = "crates/echo-core" }
echo-ipc = { path = "crates/echo-ipc" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
thiserror = "2"
anyhow = "1"
# The management face's HTTP serving (issue #31): the version bark-server-rs
# pins (resolves to 0.8.9 — the research in issue #21 measured exactly this
# unification), minimal features (default-features off saves ~138 KB raw:
# form/matched-path/original-uri/tower-log/tracing are not used; SSE needs
# no feature flag).
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
# Only for the `Stream` trait the SSE body implements (zero deps of its
# own; futures-core is already in the tree via hyper/reqwest).
futures-core = { version = "0.3", default-features = false }
toml = "1"
keyring = "4"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "process", "signal"] }
tempfile = "3"
time = { version = "0.3", features = ["formatting"] }
rand = "0.9"
