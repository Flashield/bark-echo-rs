[workspace]
resolver = "2"
members = ["crates/echo-core", "crates/echo-daemon"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
thiserror = "2"
anyhow = "1"
toml = "1"
keyring = "4"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
tempfile = "3"
