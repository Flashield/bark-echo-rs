[package]
name = "echo-daemon"
version.workspace = true
edition.workspace = true

# The product binary is named after the repository (bark-echo); the crate
# — and its directory — keep the architecture name echo-daemon (ADR-0002).
[[bin]]
name = "bark-echo"
path = "src/main.rs"

[dependencies]
# The push subcommand is the send module's first consumer (issue #6).
echo-core = { workspace = true }
# The IPC Channel the daemon serves beside its lock (ADR-0004).
echo-ipc = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
keyring = { workspace = true }
notify-rust = "4.19"
tokio = { workspace = true }
time = { workspace = true }

# Windows toast activation (ticket #17): AUMID registration + COM
# INotificationActivationCallback — the plumbing notify-rust's Windows
# backend cannot express. Features stay per API group to keep the
# compiled surface small; the dependency is only compiled for Windows
# targets.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Data_Xml_Dom",
    "Win32_Security",
    "Win32_Storage_EnhancedStorage",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "UI_Notifications",
    "Win32_UI_Notifications",
    "Win32_UI_WindowsAndMessaging",
] }
# The #[implement] COM macro expands to windows_core paths.
windows-core = "0.62"

[dev-dependencies]
# The one test seam (spec Testing Decisions): the real server, embedded
# in-process, mirroring echo-core's own test common module. Dev-only and
# revision-pinned — production builds never link the server.
bark-server-rs = { git = "https://github.com/Flashield/bark-server-rs.git", rev = "b8d832af9ade314f87fb9d349709c26ab519ce4f" }
anyhow = { workspace = true }
reqwest = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
# Async child runs (see tests/push_cli.rs): the embedded server shares
# the test runtime, so a blocking child wait would starve it.
tokio = { workspace = true, features = ["process"] }
