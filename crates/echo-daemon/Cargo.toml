[package]
name = "echo-daemon"
version.workspace = true
edition.workspace = true

[dependencies]
# The push subcommand is the send module's first consumer (issue #6).
echo-core = { path = "../echo-core" }
tokio = { workspace = true }

[dev-dependencies]
# CLI test seam: stream-side delivery observed on the fan-out (§3.4). The
# one test seam (spec Testing Decisions): the real server, embedded
# in-process. Dev-only and revision-pinned — production builds never link
# the server.
bark-server-rs = { git = "https://github.com/Flashield/bark-server-rs.git", rev = "b8d832af9ade314f87fb9d349709c26ab519ce4f" }
reqwest = { workspace = true }
# Async child runs (see tests/push_cli.rs): the embedded server shares
# the test runtime, so a blocking child wait would starve it.
tokio = { workspace = true, features = ["process"] }
serde_json = { workspace = true }
tempfile = { workspace = true }
anyhow = { workspace = true }
