[package]
name = "echo-daemon"
version.workspace = true
edition.workspace = true

# The product binary is named after the repository (bark-echo); the crate
# — and its directory — keep the architecture name echo-daemon (ADR-0002).
[[bin]]
name = "bark-echo"
path = "src/main.rs"

[dependencies]
# The push subcommand is the send module's first consumer (issue #6).
echo-core = { workspace = true }
# The IPC Channel the daemon serves beside its lock (ADR-0004).
echo-ipc = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
keyring = { workspace = true }
notify-rust = "4.19"
tokio = { workspace = true }
time = { workspace = true }

# The Tray Menu host (issue #30): tray-icon draws the icon, muda the
# menu — the pair from the 2026-11-14 framework research (§10, both
# Tauri-team crates, version-synced). tray-icon re-exports muda as its
# `menu` module; the direct muda dependency pins the pair's versions so
# a future tray-icon bump that jumps muda cannot slip past us silently.
# Linux runs the KSNI backend — its D-Bus service works on its own
# thread and needs no GTK system libraries, which keeps the "one
# binary, no installer" promise on Linux (the default libappindicator
# backend needs GTK3 installed).
tray-icon = { version = "0.26", default-features = false, features = ["ksni"] }
muda = { version = "0.21", default-features = false }
# The tray host's bare event loop (issue #30): one winit loop, no
# windows. Chosen over the Tauri fork tao (0.37) per platform facts:
# tao hard-depends on gtk 0.18 on Linux — linked, not dlopened — which
# would reintroduce exactly the GTK system-library burden the KSNI
# backend choice above avoids; winit on Linux is X11 through x11-dl
# (dlopened at runtime) and Wayland through the pure-Rust wayland
# client. The x11 + wayland features are the explicit opt-in winit 0.30
# requires on Linux (with neither, the Linux build fails at compile
# time); elsewhere they are no-ops. tray-icon 0.26's own dev-dependencies
# exercise exactly this winit 0.30 pairing, on the main thread.
winit = { version = "0.30", features = ["x11", "wayland"] }

# Windows toast activation (ticket #17): AUMID registration + COM
# INotificationActivationCallback — the plumbing notify-rust's Windows
# backend cannot express. Features stay per API group to keep the
# compiled surface small; the dependency is only compiled for Windows
# targets.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Data_Xml_Dom",
    "Win32_Security",
    "Win32_Storage_EnhancedStorage",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "UI_Notifications",
    "Win32_UI_Notifications",
    "Win32_UI_WindowsAndMessaging",
] }
# The #[implement] COM macro expands to windows_core paths.
windows-core = "0.62"

[dev-dependencies]
# The one test seam (spec Testing Decisions): the real server, embedded
# in-process, mirroring echo-core's own test common module. Dev-only and
# revision-pinned — production builds never link the server.
bark-server-rs = { git = "https://github.com/Flashield/bark-server-rs.git", rev = "b8d832af9ade314f87fb9d349709c26ab519ce4f" }
anyhow = { workspace = true }
reqwest = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
# Async child runs (see tests/push_cli.rs): the embedded server shares
# the test runtime, so a blocking child wait would starve it.
tokio = { workspace = true, features = ["process"] }
