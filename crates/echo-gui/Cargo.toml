[package]
name = "echo-gui"
version.workspace = true
edition.workspace = true

[dependencies]
# The GUI stack (ADR-0003): egui/eframe with the glow renderer, Linux's
# x11 + wayland features named explicitly (winit 0.30 fails without
# them), default features off because the default renderer is wgpu.
# `accesskit` and `default_fonts` are eframe defaults kept on purpose:
# accessibility is part of the choice, and the CJK fallback in fonts.rs
# builds on the bundled defaults.
eframe = { version = "0.37", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
egui = "0.37"
# The tray stack is framework-independent (ADR-0003): tray-icon + muda.
# Linux runs the KSNI backend — its D-Bus service works on its own
# thread and needs no GTK system libraries, which keeps the "one binary,
# no installer" promise on Linux (the default libappindicator backend
# needs GTK3 installed).
tray-icon = { version = "0.26", default-features = false, features = ["ksni"] }
# The GUI is a thin renderer over the echo-ipc client's state (ADR-0004,
# spec Testing Decisions: "echo-gui gets no seam — GUI logic is an
# echo-ipc client state machine covered by the IPC seam").
echo-ipc = { workspace = true }
thiserror = { workspace = true }
# The History Log viewer's stamps (ticket #15): the same `time` crate and
# RFC 3339 UTC format the CLI's `log` prints with (workspace features),
# so the view reads like the command it GUI-ifies.
time = { workspace = true }
tokio = { workspace = true }

# The macOS-only piece of the event-loop hook (the Accessory activation
# policy, below): eframe re-exports only some winit types, not the
# crate — the platform extension trait needs the real path. Version
# unifies with eframe's own winit 0.30.
[target.'cfg(target_os = "macos")'.dependencies]
winit = "0.30"

[dev-dependencies]
tempfile = { workspace = true }
